name: Build site

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Patch unifont googleicons JSON parse (temporary workaround)
        run: |
          FILE=node_modules/unifont/dist/index.js
          if [ -f "$FILE" ]; then
            grep -q "XSSI_PATCH" "$FILE" || sed -i "s/JSON.parse(await r.text())/JSON.parse((await r.text()).replace(/^\\)\\]\\}'\\\\n?/, '')) \/* XSSI_PATCH *\//" "$FILE" || true
          fi

      - name: Generate Nuxt site
        run: bun run build
        env:
          NUXT_PUBLIC_HCAPTCHA_SITEKEY: ${{ secrets.HCAPTCHA_SITEKEY }}
          NUXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Deploy via FTP
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
